[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-forkfuzz"
version = "0.1.0"
description = "Mainnet-fork invariant fuzzer that replays your contract against live state and stateful sequences to break protocol invariants before deploy."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "web3", "forkfuzz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/forkfuzz"

[project.scripts]
forkfuzz = "forkfuzz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["forkfuzz"]
